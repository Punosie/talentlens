[project]
name = "talentlens"
version = "0.1.0"
description = "Local resume library and JD shortlisting with on-device AI"
authors = [{ name = "punosie", email = "shubhankar.kaushik2003@gmail.com" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    # Windows: CUDA build of ONNX Runtime (NVIDIA GPU embeddings/reranking; falls back to CPU)
    "onnxruntime-gpu[cuda,cudnn]>=1.22 ; sys_platform == 'win32'",
    "pydantic-settings>=2.16.2",
    "pymongo[srv]>=4.19",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pywin32>=312 ; sys_platform == 'win32'",
    "rapidocr-onnxruntime>=1.4.4",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=7.1.0",
]

[project.scripts]
talentlens = "talentlens.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# the CPU-only onnxruntime (pulled in by fastembed/rapidocr) is replaced by onnxruntime-gpu on Windows
override-dependencies = ["onnxruntime>=1.20 ; sys_platform != 'win32'"]

[tool.uv.build-backend]
module-root = "backend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/e2e_server.py" = ["E501"]  # long synthetic resume text

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
